workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install

      - name: Compilar iOS sin firma
        script: |
          flutter build ios --release --no-codesign

      - name: Empaquetar IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r PadWorship.ipa Payload
          mv PadWorship.ipa ../../..

    artifacts:
      - "*.ipa"
      - build/ios/iphoneos/**/*.app
