workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Compilar iOS (sin firma)
        script: |
          flutter build ios --release --no-codesign
          
          # Verificar que se generó el Runner.app con contenido real
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No se encontró Runner.app en $APP_PATH"
            exit 1
          fi
          
          SIZE=$(du -sm "$APP_PATH" | cut -f1)
          echo "Runner.app pesa: ${SIZE}MB"
          if [ "$SIZE" -lt 5 ]; then
            echo "ERROR: Runner.app demasiado pequeño (${SIZE}MB), el build falló"
            exit 1
          fi
          
          echo "Build exitoso. Empaquetando IPA..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload
          
          IPA_SIZE=$(du -sm PadWorship.ipa | cut -f1)
          echo "IPA generado: ${IPA_SIZE}MB"

    artifacts:
      - "PadWorship.ipa"
