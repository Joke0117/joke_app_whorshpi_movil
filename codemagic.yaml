workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Desactivar firma via xcconfig (Flutter no lo sobreescribe)
        script: |
          # Flutter sobreescribe project.pbxproj pero NO los xcconfig
          # Agregar settings al Release.xcconfig que siempre se incluye en el build
          cat >> ios/Flutter/Release.xcconfig << 'EOF'
          DEVELOPMENT_TEAM=AAAAAAAAAA
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=
          PROVISIONING_PROFILE_SPECIFIER=
          EOF

          echo "Release.xcconfig actualizado:"
          cat ios/Flutter/Release.xcconfig

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Compilar Flutter (sin firma)
        script: |
          flutter build ios --release --no-codesign

          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app no encontrado en $APP"
            find build/ios -name "*.app" -type d 2>/dev/null | head -5
            exit 1
          fi

          SIZE=$(du -sm "$APP" | cut -f1)
          echo "Runner.app: ${SIZE}MB"

      - name: Empaquetar IPA
        script: |
          APP="build/ios/iphoneos/Runner.app"
          mkdir -p Payload
          cp -r "$APP" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload
          echo "IPA final: $(du -sm PadWorship.ipa | cut -f1)MB"

    artifacts:
      - "PadWorship.ipa"
