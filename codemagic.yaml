workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Desactivar firma en project.pbxproj
        script: |
          python3 - <<'PYEOF'
          import re, sys

          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()

          # Vaciar ajustes de firma
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = "";', content)
          content = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;', 'CODE_SIGN_IDENTITY = "";', content)
          content = re.sub(r'CODE_SIGNING_REQUIRED = [^;]*;', 'CODE_SIGNING_REQUIRED = NO;', content)
          content = re.sub(r'CODE_SIGNING_ALLOWED = [^;]*;', 'CODE_SIGNING_ALLOWED = NO;', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          content = re.sub(r'PROVISIONING_PROFILE = [^;]*;', 'PROVISIONING_PROFILE = "";', content)

          with open(path, 'w') as f:
              f.write(content)

          print("project.pbxproj actualizado — firma desactivada.")
          PYEOF

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Compilar Flutter (sin firma)
        script: |
          flutter build ios --release --no-codesign

          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app no generado en $APP"
            exit 1
          fi
          SIZE=$(du -sm "$APP" | cut -f1)
          echo "Runner.app: ${SIZE}MB en $APP"

      - name: Empaquetar IPA
        script: |
          APP="build/ios/iphoneos/Runner.app"
          mkdir -p Payload
          cp -r "$APP" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload
          echo "IPA: $(du -sm PadWorship.ipa | cut -f1)MB"

    artifacts:
      - "PadWorship.ipa"
