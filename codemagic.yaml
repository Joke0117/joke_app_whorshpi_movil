workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Generar archivos Flutter para iOS
        script: |
          # Genera los archivos .dart_tool y el código generado sin intentar compilar
          flutter build ios --release --no-codesign 2>&1 || true

      - name: Compilar con xcodebuild (sin firma)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build/ios/derivedData \
            build | xcpretty

      - name: Empaquetar IPA
        script: |
          # El Runner.app queda en derivedData
          APP_PATH=$(find build/ios/derivedData -name "Runner.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró Runner.app"
            find build/ios -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          SIZE=$(du -sm "$APP_PATH" | cut -f1)
          echo "Runner.app encontrado en: $APP_PATH (${SIZE}MB)"

          if [ "$SIZE" -lt 5 ]; then
            echo "ERROR: Runner.app muy pequeño (${SIZE}MB), build fallido"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload

          echo "IPA generado: $(du -sm PadWorship.ipa | cut -f1)MB"

    artifacts:
      - "PadWorship.ipa"
