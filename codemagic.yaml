workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Archivar con xcodebuild (sin firma)
        script: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" | xcpretty

          echo "Archivado exitoso."
          find build/Runner.xcarchive -name "Runner.app" -type d

      - name: Empaquetar IPA desde xcarchive
        script: |
          APP_PATH=$(find build/Runner.xcarchive/Products/Applications -name "Runner.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró Runner.app dentro del xcarchive"
            find build/Runner.xcarchive -type d | head -20
            exit 1
          fi

          SIZE=$(du -sm "$APP_PATH" | cut -f1)
          echo "Runner.app: $APP_PATH (${SIZE}MB)"

          if [ "$SIZE" -lt 20 ]; then
            echo "ADVERTENCIA: Runner.app pesa solo ${SIZE}MB (puede ser incompleto)"
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload

          echo "IPA final: $(du -sm PadWorship.ipa | cut -f1)MB"

    artifacts:
      - "PadWorship.ipa"
