workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Desactivar firma via xcconfig (Flutter no lo sobreescribe)
        script: |
          # Flutter sobreescribe project.pbxproj pero NO los xcconfig
          # Agregar settings al Release.xcconfig que siempre se incluye en el build
          cat >> ios/Flutter/Release.xcconfig << 'EOF'
          DEVELOPMENT_TEAM=AAAAAAAAAA
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=
          PROVISIONING_PROFILE_SPECIFIER=
          EOF

          echo "Release.xcconfig actualizado:"
          cat ios/Flutter/Release.xcconfig

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Compilar Flutter (sin firma)
        script: |
          flutter build ios --release --no-codesign

          # La ruta puede variar: buscar Runner.app en todo build/ios
          APP=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "ERROR: Runner.app no encontrado en build/ios"
            exit 1
          fi
          SIZE=$(du -sm "$APP" | cut -f1)
          echo "Runner.app: ${SIZE}MB en $APP"
          echo "APP_PATH=$APP" > /tmp/app_path.env

      - name: Empaquetar IPA
        script: |
          source /tmp/app_path.env
          echo "Empaquetando: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r PadWorship.ipa Payload
          rm -rf Payload
          echo "IPA final: $(du -sm PadWorship.ipa | cut -f1)MB"

    artifacts:
      - "PadWorship.ipa"
