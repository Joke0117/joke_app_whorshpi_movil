workflows:
  ios-workflow:
    name: Pad Worship iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get

      - name: Instalar pods de iOS
        script: |
          cd ios && pod install --repo-update

      - name: Compilar iOS sin firma (forzado)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=FLUTTER_TARGET=lib/main.dart
          
          # Si flutter falla, intentar con xcodebuild directo
          if [ $? -ne 0 ]; then
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE="" \
              build
          fi

      - name: Empaquetar IPA sin firma
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r PadWorship.ipa Payload
          mv PadWorship.ipa ../../..

    artifacts:
      - "*.ipa"
      - build/ios/iphoneos/**/*.app
